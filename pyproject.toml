[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoploss"]

[project]
name = "stop-loss-calculator"
version = "0.4.0"
description = "Precision stop-loss calculator for futures trading with tax, energy, and margin accounting"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Stop Loss Calculator Contributors"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "streamlit>=1.40",  # st.segmented_control
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.1",
    "black>=23.11",
    "mypy>=1.7",
    "types-requests",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "ARG", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match real call signatures even when args go unused
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests requiring external API calls",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-64", "osx-arm64", "linux-64"]

[tool.pixi.activation.env]
# Prevents a Windows per-user site-packages install (e.g. an existing global
# pytest/streamlit) from shadowing packages inside this isolated pixi env.
PYTHONNOUSERSITE = "1"

[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
stop-loss-calculator = { path = ".", editable = true }

[tool.pixi.tasks]
dashboard = "streamlit run simple_dashboard.py"
api = "uvicorn api.app:app --reload"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
httpx = ">=0.27"
hypothesis = ">=6.100"
ruff = ">=0.1"
black = ">=23.11"
mypy = ">=1.7"
types-requests = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest tests/ -v --cov=src/stoploss --cov-fail-under=85"
lint = "ruff check src/ tests/ api/ simple_dashboard.py"
format-check = "black --check src/ tests/ api/ simple_dashboard.py"
typecheck = "mypy src/ --ignore-missing-imports"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
